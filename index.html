<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f0ea" />
    <title>Ftesë dasme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stili.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23f3f0ea' width='64' height='64'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' font-family='Georgia' fill='%236a7048'%3EE%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body class="is-intro">
    <div class="grain" aria-hidden="true"></div>

    <section class="hyrje" id="hyrje">
      <div class="shirit" aria-hidden="true"></div>
      <img class="gjeth" src="foto/gjeth.png" alt="" />
      <div class="hyrje-qender">
        <p class="kicker">Na takoni në</p>
        <h1 class="shkrim" id="vendiHyrje"></h1>
        <button class="play" id="play" type="button" aria-label="Hap ftesën">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="34,18 34,82 84,50" fill="#ffffff" />
          </svg>
        </button>
        <p class="rresht-data" id="dataHyrje"></p>
        <p class="rresht-ora" id="oraHyrje"></p>
        <p class="kicker kicker-pas">Ftesa zyrtare pason</p>
      </div>
      <div class="numeratori" aria-hidden="true">
        <div class="njesi"><strong data-njesi="d">0</strong><span>Ditë</span></div>
        <span class="pika">:</span>
        <div class="njesi"><strong data-njesi="h">00</strong><span>Orë</span></div>
        <span class="pika">:</span>
        <div class="njesi"><strong data-njesi="m">00</strong><span>Minuta</span></div>
        <span class="pika">:</span>
        <div class="njesi"><strong data-njesi="s">00</strong><span>Sekonda</span></div>
      </div>
    </section>

    <main id="festa" hidden>
      <section class="skena" id="skena" data-state="closed">
        <div class="xhep">
          <svg class="palosjet" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 100 L50 58 L100 100" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="0.35" />
            <path d="M0 100 L50 58 L100 100" fill="none" stroke="rgba(30,28,16,.16)" stroke-width="0.2" />
            <path d="M50 58 L50 100" fill="none" stroke="rgba(30,28,16,.12)" stroke-width="0.25" />
          </svg>
          <div class="vula-poshte" aria-hidden="true">
            <svg viewBox="0 0 120 156">
              <ellipse cx="60" cy="78" rx="46" ry="60" fill="#f6f2ea" />
              <ellipse cx="60" cy="78" rx="39" ry="52" fill="none" stroke="#d9d0c0" stroke-width="1.4" />
              <path d="M60 48 C60 62 52 70 52 82 C52 94 60 98 60 108" fill="none" stroke="#cbbfae" stroke-width="1.3" />
              <path d="M60 74 C48 66 40 56 43 46 C52 54 58 66 60 74" fill="none" stroke="#cbbfae" stroke-width="1.3" />
              <path d="M60 78 C74 68 84 58 79 46 C70 56 63 68 60 78" fill="none" stroke="#cbbfae" stroke-width="1.3" />
            </svg>
          </div>
          <p class="hap-etikete">Hapeni ftesën</p>
          <div class="numeratori numeratori-zarf" aria-hidden="true">
            <div class="njesi"><strong data-njesi="d">0</strong><span>Ditë</span></div>
            <span class="pika">:</span>
            <div class="njesi"><strong data-njesi="h">00</strong><span>Orë</span></div>
            <span class="pika">:</span>
            <div class="njesi"><strong data-njesi="m">00</strong><span>Minuta</span></div>
            <span class="pika">:</span>
            <div class="njesi"><strong data-njesi="s">00</strong><span>Sekonda</span></div>
          </div>
        </div>

        <div class="kapak" id="kapak">
          <img class="dantel-rrip dantel-majte" src="foto/dantel.png" alt="" />
          <img class="dantel-rrip dantel-djathte" src="foto/dantel.png" alt="" />
          <div class="leter">
            <p class="kicker kicker-zarf">Një letër dashurie nga</p>
            <p class="shkrim shkrim-zarf" id="emratLeter"></p>
          </div>
        </div>

        <button class="vula" id="vula" type="button" aria-label="Hap zarfin">
          <svg viewBox="0 0 120 156" aria-hidden="true">
            <defs>
              <radialGradient id="dyll" cx="38%" cy="32%" r="75%">
                <stop offset="0%" stop-color="#fffdf8" />
                <stop offset="58%" stop-color="#f4f0e7" />
                <stop offset="100%" stop-color="#ddd3c2" />
              </radialGradient>
            </defs>
            <ellipse cx="60" cy="78" rx="48" ry="62" fill="url(#dyll)" />
            <ellipse cx="60" cy="78" rx="41" ry="54" fill="none" stroke="#d5cbb8" stroke-width="1.4" />
            <ellipse cx="60" cy="78" rx="46" ry="59" fill="none" stroke="#efe8dc" stroke-width="1" />
            <g fill="none" stroke="#c8beab" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
              <path d="M60 40 C60 54 51 62 51 74 C51 86 60 90 60 100" />
              <path d="M60 66 C46 58 38 48 41 38 C50 46 57 58 60 66" />
              <path d="M60 70 C74 60 84 50 79 38 C70 48 63 60 60 70" />
              <path d="M52 92 C40 98 36 108 40 114" />
              <path d="M68 94 C80 102 84 112 78 118" />
            </g>
            <text id="vulaTekst" x="60" y="128" text-anchor="middle" fill="#b3a894" font-size="13" font-family="Cormorant Garamond, Georgia, serif" letter-spacing="1.5"></text>
          </svg>
        </button>

        <div class="kompozim" id="kompozim" aria-hidden="true">
          <div class="kompozim-brenda">
            <img class="bozhure" src="foto/bozhure.png" alt="" />

            <div class="kornize">
              <div class="kornize-brenda">
                <img id="foto" alt="" hidden />
                <div class="monogram-foto" id="monogramFoto">
                  <span id="inicFoto1"></span>
                  <span id="inicFoto2"></span>
                </div>
              </div>
            </div>

            <article class="karte">
              <div class="vija" aria-hidden="true"></div>
              <div class="karte-brenda">
                <p class="kicker">Ruajeni datën</p>
                <div class="ndares" aria-hidden="true"><span></span><i></i><span></span></div>
                <h2 class="shkrim shkrim-karte" id="emriNusja"></h2>
                <p class="amp">&amp;</p>
                <h2 class="shkrim shkrim-karte" id="emriDhendri"></h2>
              </div>
            </article>

            <div class="zemer">
              <svg viewBox="0 0 200 190" aria-hidden="true">
                <path
                  d="M100 168 C28 118 8 78 28 50 C48 24 80 28 100 56 C120 28 152 24 172 50 C192 78 172 118 100 168 Z"
                  fill="#722333"
                />
                <path
                  d="M100 154 C42 112 26 80 42 58 C56 40 80 44 100 66 C120 44 144 40 158 58 C174 80 158 112 100 154 Z"
                  fill="none"
                  stroke="rgba(255,236,236,.55)"
                  stroke-width="1.4"
                />
              </svg>
              <span id="dataZemer"></span>
            </div>

            <img class="lule" src="foto/lulet.png" alt="" />
          </div>
        </div>
      </section>

      <section class="fund" id="fund">
        <div class="fund-krem">
          <div class="numeratori numeratori-fund" aria-hidden="true">
            <div class="njesi"><strong data-njesi="d">0</strong><span>Ditë</span></div>
            <span class="pika">:</span>
            <div class="njesi"><strong data-njesi="h">00</strong><span>Orë</span></div>
            <span class="pika">:</span>
            <div class="njesi"><strong data-njesi="m">00</strong><span>Minuta</span></div>
            <span class="pika">:</span>
            <div class="njesi"><strong data-njesi="s">00</strong><span>Sekonda</span></div>
          </div>
          <p class="sebashku">Presim me padurim të festojmë së bashku.</p>
          <p class="rresht-data" id="dataRresht" hidden></p>
          <p class="rresht-ora" id="oraRresht" hidden></p>
          <p class="rresht-vend" id="vendi" hidden></p>
          <p class="rresht-salle" id="sallaHyrje" hidden></p>
          <h2 class="shkrim shkrim-fund" id="emratFund" hidden></h2>
        </div>

        <div class="dashuri">
          <svg class="kallinj" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
            <g fill="none" stroke="rgba(255,248,240,.38)" stroke-width="1.3">
              <path d="M40 860 C50 640 20 520 48 300" />
              <path d="M90 860 C80 620 120 500 96 280" />
              <path d="M150 860 C160 600 130 480 158 260" />
              <path d="M220 860 C200 640 240 520 214 340" />
              <path d="M300 860 C310 620 270 500 292 240" />
              <path d="M380 860 C360 600 410 500 386 320" />
              <path d="M470 860 C490 640 440 520 468 300" />
              <path d="M560 860 C540 600 590 480 562 250" />
              <path d="M660 860 C680 640 630 520 658 310" />
              <path d="M760 860 C740 600 800 500 770 280" />
              <path d="M860 860 C880 640 830 520 858 300" />
              <path d="M960 860 C940 620 990 500 962 270" />
              <path d="M1060 860 C1080 640 1020 520 1050 320" />
              <path d="M1160 860 C1140 600 1200 480 1170 260" />
              <path d="M1260 860 C1280 640 1220 520 1254 300" />
              <path d="M1360 860 C1340 620 1390 500 1368 280" />
              <path d="M1420 860 C1410 640 1440 520 1416 340" />
            </g>
            <g fill="none" stroke="rgba(28,22,18,.28)" stroke-width="1.1">
              <path d="M120 860 C140 700 90 620 110 480" />
              <path d="M340 860 C320 680 370 600 348 460" />
              <path d="M620 860 C640 700 590 600 616 470" />
              <path d="M900 860 C880 690 940 590 910 450" />
              <path d="M1180 860 C1200 700 1140 600 1172 480" />
            </g>
            <g fill="rgba(236,228,216,.45)">
              <ellipse cx="48" cy="292" rx="7" ry="16" transform="rotate(-12 48 292)" />
              <ellipse cx="158" cy="252" rx="6" ry="15" transform="rotate(10 158 252)" />
              <ellipse cx="292" cy="232" rx="7" ry="17" transform="rotate(-8 292 232)" />
              <ellipse cx="562" cy="242" rx="6" ry="16" transform="rotate(14 562 242)" />
              <ellipse cx="770" cy="272" rx="7" ry="16" transform="rotate(-16 770 272)" />
              <ellipse cx="962" cy="262" rx="6" ry="15" transform="rotate(8 962 262)" />
              <ellipse cx="1170" cy="252" rx="7" ry="16" transform="rotate(-10 1170 252)" />
              <ellipse cx="1368" cy="272" rx="6" ry="15" transform="rotate(12 1368 272)" />
            </g>
          </svg>

          <div class="dashuri-brenda">
            <p class="me-dashuri">Me dashuri</p>
            <div class="ovale">
              <svg class="ovale-lule" viewBox="0 0 64 24" aria-hidden="true">
                <path d="M4 12 H26" stroke="rgba(255,255,255,.8)" stroke-width="1" />
                <path d="M38 12 H60" stroke="rgba(255,255,255,.8)" stroke-width="1" />
                <circle cx="32" cy="12" r="3.2" fill="none" stroke="rgba(255,255,255,.85)" />
              </svg>
              <p class="ovale-emri"><span id="inic1"></span><span id="inic2"></span></p>
              <svg class="ovale-lule" viewBox="0 0 64 24" aria-hidden="true">
                <path d="M4 12 H26" stroke="rgba(255,255,255,.8)" stroke-width="1" />
                <path d="M38 12 H60" stroke="rgba(255,255,255,.8)" stroke-width="1" />
                <circle cx="32" cy="12" r="3.2" fill="none" stroke="rgba(255,255,255,.85)" />
              </svg>
            </div>
            <p class="emrat-poshte" id="emratPoshte"></p>
            <p class="data-poshte" id="dataPoshte"></p>
            <button class="kthehu" id="kthehu" type="button">Kthehu te ftesa</button>
          </div>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
